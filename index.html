        .safe-area-top {

        }

        }

        }
        
        .card-shadow {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card-hover:active {
            transform: scale(0.98);
        }
        
        .timeline-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
        }
        
        .timeline-line {
            width: 2px;
            background: linear-gradient(180deg, #007AFF 0%, #5856D6 100%);
            opacity: 0.3;
        }
        
        .checkbox-custom {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #d1d1d6;
            border-radius: 50%;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .checkbox-custom:checked {
            background: linear-gradient(135deg, #34C759 0%, #30D158 100%);
            border-color: transparent;
        }
        
        .checkbox-custom:checked::after {
            content: '✓';
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            height: 100%;
        }
        
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        
        .accordion-content.open {
            max-height: 1000px;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-up {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>

        const guideData = [

        // ========== ICON COMPONENT ==========
        const Icon = ({ name, size = 20, className = '' }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && lucide[name]) {
                    iconRef.current.innerHTML = '';
                    const svg = lucide.createElement(lucide[name]);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    iconRef.current.appendChild(svg);
                }
            }, [name, size]);
            
            const iconNameMap = {
                'plane-landing': 'PlaneLanding',
                'hotel': 'Hotel',
                'tablet': 'Tablet',
                'utensils': 'Utensils',
                'coffee': 'Coffee',
                'bus': 'Bus',
                'trophy': 'Trophy',
                'beer': 'Beer',
                'landmark': 'Landmark',
                'waves': 'Waves',
                'fish': 'Fish',
                'map-pin': 'MapPin',
                'music': 'Music',
                'alert-circle': 'AlertCircle',
                'shopping-bag': 'ShoppingBag',
                'mail': 'Mail',
                'log-out': 'LogOut',
                'plane': 'Plane',
                'calendar': 'Calendar',
                'check-square': 'CheckSquare',
                'book-open': 'BookOpen',
                'chevron-down': 'ChevronDown',
                'chevron-up': 'ChevronUp',
                'sun': 'Sun'
            };
            
            const mappedName = iconNameMap[name] || name;
            
            useEffect(() => {
                if (iconRef.current && lucide[mappedName]) {
                    iconRef.current.innerHTML = '';
                    const svg = lucide.createElement(lucide[mappedName]);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    className.split(' ').forEach(cls => {
                        if (cls) svg.classList.add(cls);
                    });
                    iconRef.current.appendChild(svg);
                }
            }, [mappedName, size, className]);
            
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`} />;
        };
        
        // ========== TAB BAR COMPONENT ==========
        const TabBar = ({ activeTab, setActiveTab }) => {

            });
            
            useEffect(() => {
                localStorage.setItem('okinawa-todos', JSON.stringify(todos));
            }, [todos]);
            
            const toggleTodo = (id) => {
                setTodos(prev => prev.map(todo => 
                    todo.id === id ? { ...todo, checked: !todo.checked } : todo
                ));
            };
            
            const completedCount = todos.filter(t => t.checked).length;
            const progress = (completedCount / todos.length) * 100;
            
            return (

                    <div className="mb-6">
                        <h2 className="text-2xl font-bold text-apple-gray-900 mb-1">必做清單</h2>
                        <p className="text-apple-gray-500">完成度 {completedCount}/{todos.length}</p>
                    </div>
                    
                    {/* Progress Bar */}
                    <div className="bg-white rounded-2xl card-shadow p-5 mb-6">
                        <div className="flex items-center justify-between mb-3">
                            <span className="text-sm font-medium text-apple-gray-700">旅程進度</span>
                            <span className="text-sm font-semibold text-apple-green">{Math.round(progress)}%</span>
                        </div>
                        <div className="h-3 bg-apple-gray-100 rounded-full overflow-hidden">
                            <div 
                                className="h-full bg-gradient-to-r from-apple-green to-emerald-400 rounded-full transition-all duration-500"
                                style={{ width: `${progress}%` }}
                            />
                        </div>
                    </div>
                    
                    {/* Todo List */}
                    <div className="bg-white rounded-2xl card-shadow overflow-hidden">
                        {todos.map((todo, index) => (
                            <div
                                key={todo.id}
                                onClick={() => toggleTodo(todo.id)}
                                className={`flex items-center px-5 py-4 cursor-pointer transition-all duration-200 card-hover ${
                                    index !== todos.length - 1 ? 'border-b border-apple-gray-100' : ''
                                } ${todo.checked ? 'bg-apple-gray-50' : ''}`}
                            >
                                <input
                                    type="checkbox"
                                    checked={todo.checked}
                                    onChange={() => {}}
                                    className="checkbox-custom mr-4"
                                />
                                <span className="text-2xl mr-3">{todo.emoji}</span>
                                <span className={`flex-1 font-medium transition-all duration-200 ${
                                    todo.checked 
                                        ? 'text-apple-gray-400 line-through' 
                                        : 'text-apple-gray-900'
                                }`}>
                                    {todo.text}
                                </span>
                            </div>
                        ))}
                    </div>
                    
                    {/* Reset Button */}
                    <button
                        onClick={() => setTodos(todoData)}
                        className="w-full mt-4 py-3 text-apple-red text-sm font-medium rounded-xl bg-red-50 active:bg-red-100 transition-colors"
                    >
                        重設清單
                    </button>
                </div>
            );
        };
        
        // ========== GUIDE PAGE ==========
        const GuidePage = () => {
            const [openSection, setOpenSection] = useState('transport');
            
            return (
                <div className="px-4 py-6 safe-area-bottom fade-in">
                    <div className="mb-6">
                        <h2 className="text-2xl font-bold text-apple-gray-900 mb-1">旅遊攻略</h2>
                        <p className="text-apple-gray-500">實用資訊一手掌握</p>
                    </div>
                    
                    <div className="space-y-3">
                        {guideData.map((section, sectionIndex) => (
                            <div 
                                key={section.id}
                                className="bg-white rounded-2xl card-shadow overflow-hidden slide-up"
                                style={{ animationDelay: `${sectionIndex * 0.1}s` }}
                            >
                                <button
                                    onClick={() => setOpenSection(openSection === section.id ? null : section.id)}
                                    className="w-full px-5 py-4 flex items-center justify-between"
                                >
                                    <div className="flex items-center space-x-3">
                                        <span className="text-2xl">{section.emoji}</span>
                                        <span className="font-semibold text-apple-gray-900">{section.title}</span>
                                    </div>
                                    <Icon 
                                        name={openSection === section.id ? 'ChevronUp' : 'ChevronDown'} 
                                        size={20} 
                                        className="text-apple-gray-400"
                                    />
                                </button>
                                
                                <div className={`accordion-content ${openSection === section.id ? 'open' : ''}`}>
                                    <div className="px-5 pb-5 space-y-4">
                                        {section.content.map((item, index) => (
                                            <div key={index} className="bg-apple-gray-50 rounded-xl p-4">
                                                <h4 className="font-medium text-apple-gray-900 mb-2 text-sm">{item.subtitle}</h4>
                                                <p className="text-sm text-apple-gray-600 whitespace-pre-line leading-relaxed">{item.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    {/* Emergency Info */}
                    <div className="mt-6 bg-gradient-to-br from-apple-blue to-apple-purple rounded-2xl p-5 text-white">
                        <h3 className="font-semibold mb-3">📞 緊急聯絡</h3>
                        <div className="space-y-2 text-sm opacity-90">
                            <p>• 日本緊急電話：110（警察）/ 119（消防、救護）</p>
                            <p>• 台北駐日經濟文化代表處：+81-3-3280-7811</p>
                            <p>• 旅遊日文求助：「助けてください」(Tasukete kudasai)</p>
                        </div>
                    </div>
                </div>
            );
        };
        
        // ========== MAIN APP ==========
        const App = () => {
            const [activeTab, setActiveTab] = useState('itinerary');
            
            const renderPage = () => {
                switch (activeTab) {
                    case 'itinerary':
                        return <ItineraryPage />;
                    case 'todo':
                        return <TodoPage />;
                    case 'guide':
                        return <GuidePage />;
                    default:
                        return <ItineraryPage />;
                }
            };
            
            return (
                <div className="min-h-screen bg-apple-gray-100">
                    <Header />
                    <main className="max-w-lg mx-auto">
                        {renderPage()}
                    </main>
                    <TabBar activeTab={activeTab} setActiveTab={setActiveTab} />
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
